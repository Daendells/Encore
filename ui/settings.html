<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encore</title>
<link rel="stylesheet" href="settings.css">
</head>
<body>
<main>
  <h1 data-t="settings.title"></h1>
  <p id="error" role="alert" hidden></p>

  <section aria-labelledby="look-title">
    <h2 id="look-title" data-t="settings.look"></h2>

    <fieldset>
      <legend><span data-t="settings.preset"></span> <span id="preset-custom" class="state" aria-live="polite"></span></legend>
      <div id="presets" class="choices"></div>
    </fieldset>

    <div class="field">
      <label for="place" data-t="settings.position"></label>
      <select id="place"></select>
    </div>

    <fieldset>
      <legend data-t="settings.lines"></legend>
      <div class="choices two" aria-describedby="lines-help">
        <input id="lines-1" type="radio" name="lines" value="1"><label for="lines-1" data-t="settings.lines.1"></label>
        <input id="lines-3" type="radio" name="lines" value="3"><label for="lines-3" data-t="settings.lines.3"></label>
      </div>
      <p id="lines-help" class="help" data-t="settings.lines.help"></p>
    </fieldset>

    <div class="field">
      <div class="row">
        <label for="size" data-t="settings.size"></label>
        <output id="size-out" for="size"></output>
      </div>
      <input id="size" type="range" min="12" max="48" step="1">
    </div>

    <div class="field">
      <div class="row">
        <label for="plate" data-t="settings.plate"></label>
        <output id="plate-out" for="plate"></output>
      </div>
      <input id="plate" type="range" min="0" max="70" step="5" aria-describedby="plate-help">
      <p id="plate-help" class="help" data-t="settings.plate.help"></p>
    </div>

    <div class="field">
      <div class="row">
        <label for="width" data-t="settings.width"></label>
        <output id="width-out" for="width"></output>
      </div>
      <input id="width" type="range" min="40" max="90" step="5">
    </div>

    <fieldset>
      <legend data-t="settings.accent"></legend>
      <div id="accents" class="choices"></div>
    </fieldset>

    <button id="reset-look" type="button" data-t="settings.reset_look"></button>
  </section>

  <section aria-labelledby="offsets-title">
    <h2 id="offsets-title" data-t="settings.offsets"></h2>
    <p id="offsets-help" class="help" data-t="settings.offsets.help"></p>
    <p id="offsets-empty" class="help" data-t="settings.offsets.empty" hidden></p>
    <ul id="offsets"></ul>
  </section>

  <section>
    <div class="check">
      <input id="capture" type="checkbox" aria-describedby="capture-help">
      <label for="capture" data-t="settings.capture"></label>
    </div>
    <p id="capture-help" class="help hang" data-t="settings.capture.help"></p>
    <div class="check">
      <input id="autostart" type="checkbox">
      <label for="autostart" data-t="settings.autostart"></label>
    </div>
  </section>

  <section aria-labelledby="shortcuts-title">
    <h2 id="shortcuts-title" data-t="settings.shortcuts"></h2>
    <ul id="shortcuts"></ul>
    <p class="help" data-t="settings.move_hint"></p>
    <p class="help"><span data-t="settings.version"></span> <span id="version"></span></p>
  </section>
</main>
<script src="settings.js"></script>
</body>
</html>
