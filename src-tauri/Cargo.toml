[package]
name = "encore"
version = "0.1.0"
edition = "2021"

[lib]
name = "encore_lib"

# An example and not a second binary: Tauri puts every binary in the installer.
[[example]]
name = "eval"
test = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
strsim = "0.11.1"
unicode-normalization = "0.1.26"
windows = { version = "0.62.2", features = ["Foundation", "Media_Control", "Win32_System_WinRT", "Win32_System_LibraryLoader", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Globalization"] }
windows-future = "0.3.2"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
webview2-com = "0.39"

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
