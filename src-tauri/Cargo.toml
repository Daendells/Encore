[package]
name = "larik"
version = "0.1.0"
edition = "2021"

[lib]
name = "larik_lib"

# An example and not a second binary: Tauri puts every binary in the installer.
[[example]]
name = "eval"
test = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
strsim = "0.11.1"
unicode-normalization = "0.1.26"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
